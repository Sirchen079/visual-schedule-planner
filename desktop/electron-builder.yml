appId: com.zhishi.desktop
productName: 知时
copyright: Copyright © 2026 Sirchen079
directories:
  output: release
# 进入 app.asar 的文件（Electron 主进程代码 + 图标资源）
files:
  - electron/**/*
  - package.json
  - build/icon.ico
  - build/icon-256.png
# 不进 asar、放到 resources/ 下：后端 exe 及其 _internal 资源。
# build/backend-dist/zhishi-backend/ 是 PyInstaller 产物目录（含 zhishi-backend.exe + _internal/），
# 整个 zhishi-backend 子目录会被复制到 resources/zhishi-backend/，与 main.js backendExePath() 对齐。
extraResources:
  - from: build/backend-dist/zhishi-backend
    to: zhishi-backend
    filter:
      - '**/*'
win:
  icon: build/icon.ico
  target:
    - target: dir           # 只生成 win-unpacked，由 Inno Setup 打包成安装包
      arch:
        - x64
