<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <title>知时 · 随身秘书</title>
  <link rel="stylesheet" href="widget.css">
</head>
<body>
  <main class="panel">
    <header>
      <img src="assets/icon.svg" width="34" height="34" alt="">
      <div class="brand"><strong>知时</strong><span id="summary">随身秘书</span></div>
      <button id="pin" title="取消置顶" aria-label="取消置顶" aria-pressed="true">钉</button>
      <button id="collapse" title="收起" aria-label="收起" aria-expanded="true">−</button>
      <button id="hide" title="隐藏 · Ctrl+Alt+Z 唤回" aria-label="隐藏悬浮窗">×</button>
    </header>
    <section class="body">
      <div class="heading"><div><span class="eyebrow">留一点从容给今天</span><h1>今日安排 <span id="count"></span></h1></div><button id="refresh" title="刷新安排">刷新</button></div>
      <p id="date"></p>
      <div id="items" aria-label="今日安排列表"><p class="empty">正在读取今天的安排…</p></div>
      <p id="status" role="status" aria-live="polite"></p>
      <form id="capture">
        <label for="title">快速记下 · 加入今日待办</label>
        <div class="input-row"><input id="title" maxlength="200" placeholder="还有什么需要记住？" autocomplete="off" required><button id="add" type="submit">记下</button></div>
      </form>
      <button id="main" class="open-main">打开知时 · 对话、文件与完整计划 <span>↗</span></button>
      <footer>拖动顶部移动 <span>Ctrl + Alt + Z 显示 / 隐藏</span></footer>
    </section>
  </main>
  <script src="widget-renderer.js"></script>
</body>
</html>
